<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="screen-orientation" content="landscape">
    <title>NEON VOID</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>

        <!-- HUD Overlay -->
        <div id="hud">
            <div class="hud-left">
                <div id="score-display">
                    <span class="hud-label">SCORE</span>
                    <span class="hud-value" id="score-value">0</span>
                </div>
                <div id="multiplier-display">
                    <span class="hud-label">MULTI</span>
                    <span class="hud-value" id="multiplier-value">x1</span>
                </div>
            </div>
            <div class="hud-center">
                <div id="wave-display">
                    <span class="hud-value" id="wave-value">WAVE 1</span>
                </div>
            </div>
            <div class="hud-right">
                <div id="lives-display">
                    <span class="hud-label">LIVES</span>
                    <span class="hud-value" id="lives-value"></span>
                </div>
                <div id="weapon-display">
                    <span class="hud-label">WEAPON</span>
                    <span class="hud-value" id="weapon-value">PULSE</span>
                </div>
            </div>
        </div>

        <!-- Touch Zone Indicators (fade out after first touch) -->
        <div id="touch-zones">
            <div class="touch-zone left-zone">
                <div class="zone-icon">
                    <svg width="80" height="80" viewBox="0 0 80 80">
                        <circle cx="40" cy="40" r="35" fill="none" stroke="rgba(0,255,255,0.3)" stroke-width="2" stroke-dasharray="5,5"/>
                        <circle cx="40" cy="40" r="12" fill="rgba(0,255,255,0.2)"/>
                    </svg>
                </div>
                <span class="zone-label">MOVE</span>
            </div>
            <div class="touch-zone right-zone">
                <div class="zone-icon">
                    <svg width="80" height="80" viewBox="0 0 80 80">
                        <circle cx="40" cy="40" r="35" fill="none" stroke="rgba(255,0,102,0.3)" stroke-width="2" stroke-dasharray="5,5"/>
                        <line x1="40" y1="15" x2="40" y2="65" stroke="rgba(255,0,102,0.3)" stroke-width="2"/>
                        <line x1="15" y1="40" x2="65" y2="40" stroke="rgba(255,0,102,0.3)" stroke-width="2"/>
                    </svg>
                </div>
                <span class="zone-label">AIM & FIRE</span>
            </div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="screen active">
            <div class="screen-content">
                <h1 class="game-title">NEON VOID</h1>
                <p class="game-subtitle">Survive the void. Become the light.</p>
                <div class="title-divider"></div>
                <button id="start-btn" class="cta-button">ENTER THE VOID</button>
                <div class="controls-info">
                    <div class="control-item">
                        <span class="control-key">LEFT</span>
                        <span class="control-desc">Drag to move</span>
                    </div>
                    <div class="control-item">
                        <span class="control-key">RIGHT</span>
                        <span class="control-desc">Drag to aim & shoot</span>
                    </div>
                </div>
                <p class="desktop-hint">Desktop: WASD + Mouse</p>
            </div>
        </div>

        <!-- Wave Announcement -->
        <div id="wave-announce" class="wave-announce">
            <span class="wave-text">WAVE 1</span>
        </div>

        <!-- Game Over Screen -->
        <div id="gameover-screen" class="screen">
            <div class="screen-content">
                <h2 class="game-title gameover-title">VOID CONSUMED</h2>
                <p id="high-score-text" class="high-score-text"></p>
                <div id="final-stats">
                    <div class="stat-row">
                        <span class="stat-label">SCORE</span>
                        <span class="stat-value" id="final-score">0</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">WAVE</span>
                        <span class="stat-value" id="final-wave">1</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">KILLS</span>
                        <span class="stat-value" id="final-kills">0</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">BEST MULTI</span>
                        <span class="stat-value" id="final-multiplier">x1</span>
                    </div>
                </div>
                <button id="retry-btn" class="cta-button">RE-ENTER</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
